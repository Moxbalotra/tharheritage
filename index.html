<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hotel Thar Heritage Resort | Coming Soon – Grand Opening</title>
<meta name="description" content="Hotel Thar Heritage Resort – Grand Opening coming soon.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Serif+Devanagari:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1f44;
  --gold:#b8862f;
  --gold-soft:#d9b56a;
  --red:#c8102e;
  --red-deep:#8f0b20;
  --lw:min(clamp(180px,30vw,320px),33vh);
  --sx:0; --sy:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100svh;
  background:
    radial-gradient(ellipse 70% 55% at 50% 36%, #ffffff 0%, #ffffff 35%, #faf7f0 75%, #f3eee2 100%);
  color:var(--navy);
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* ---------- 3D stage ---------- */
.stage{
  position:relative;z-index:1;
  width:min(100%,calc(var(--lw)*2));
  margin-inline:auto;
  height:calc(var(--lw)*1.62);
  perspective:1100px;
  display:flex;align-items:center;justify-content:center;
  touch-action:pan-y;
}
.rig{
  position:relative;
  width:var(--lw);height:calc(var(--lw)*1.2999);
  transform-style:preserve-3d;
  will-change:transform;
}
.arch{
  position:absolute;left:50%;top:50%;
  width:calc(var(--lw)*1.5);
  height:auto;overflow:visible;
  transform:translate3d(-50%,-53%,var(--z));
  opacity:0;
  animation:archIn 1.6s cubic-bezier(.2,.7,.2,1) forwards;
  animation-delay:var(--d);
  -webkit-mask-image:linear-gradient(#000 55%,transparent 98%);
          mask-image:linear-gradient(#000 55%,transparent 98%);
}
.arch path{fill:rgba(184,134,47,.035);stroke:url(#g);stroke-width:1.3;vector-effect:non-scaling-stroke}
@keyframes archIn{
  from{opacity:0;transform:translate3d(-50%,-53%,calc(var(--z) - 160px)) scale(.92)}
  to{opacity:var(--o);transform:translate3d(-50%,-53%,var(--z))}
}
.logo{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  animation:logoIn 2s cubic-bezier(.16,.8,.2,1) .15s both;
}
@keyframes logoIn{
  from{opacity:0;transform:rotateY(-150deg) translateY(34px) scale(.82)}
  55%{opacity:1}
  to{opacity:1;transform:none}
}
.layer{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none;
  backface-visibility:visible;
}
.shine{
  position:absolute;inset:0;pointer-events:none;
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  background:linear-gradient(112deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) no-repeat;
  background-size:260% 100%;
  background-position:140% 0;
  animation:sweep 6.5s ease-in-out 2.6s infinite;
  transform:translateZ(2px);
}
@keyframes sweep{
  0%{background-position:140% 0}
  32%,100%{background-position:-60% 0}
}
.floor{
  position:absolute;left:50%;bottom:calc(var(--lw)*.14);
  width:calc(var(--lw)*.95);height:22px;margin-left:calc(var(--lw)*-.475);
  background:radial-gradient(ellipse at center,rgba(11,31,68,.26) 0%,rgba(11,31,68,.08) 50%,transparent 72%);
  filter:blur(5px);
  opacity:0;animation:fadeIn 1.4s ease 1.3s forwards;
}
@keyframes fadeIn{to{opacity:1}}

/* ---------- Copy ---------- */
.copy{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;margin-top:clamp(2px,1vh,12px);
}
.soon{
  display:flex;align-items:center;gap:clamp(12px,2.4vw,26px);
  font-weight:500;font-size:clamp(17px,2.5vw,26px);
  letter-spacing:.34em;padding-left:.34em;
  color:var(--navy);
  opacity:0;animation:fadeIn 1.2s ease 1.7s forwards;
}
.soon i{
  display:block;width:clamp(34px,8vw,92px);height:1px;
  background:linear-gradient(90deg,transparent,var(--gold));
  position:relative;
}
.soon i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
.grand{
  margin-top:clamp(2px,1vh,10px);
  font-style:italic;font-weight:600;
  font-size:clamp(46px,10.5vw,118px);line-height:1.05;
  color:var(--red);
  padding:0 .06em .08em;
  text-shadow:
    calc(var(--sx)*1px) calc(var(--sy)*1px) 0 #a30d24,
    calc(var(--sx)*2px) calc(var(--sy)*2px) 0 #960c22,
    calc(var(--sx)*3px) calc(var(--sy)*3px) 0 #8a0a1f,
    calc(var(--sx)*4px) calc(var(--sy)*4px) 0 #7b091c,
    calc(var(--sx)*5px) calc(var(--sy)*5px) 0 rgba(123,9,28,.55),
    calc(var(--sx)*8px) calc(var(--sy)*12px) 18px rgba(200,16,46,.22);
  clip-path:inset(-20% 100% -20% 0);
  animation:wipe 1.5s cubic-bezier(.6,.05,.2,1) 2s forwards;
  white-space:nowrap;
}
@keyframes wipe{to{clip-path:inset(-20% -10% -20% 0)}}
.hi{
  margin-top:clamp(8px,1.6vh,16px);
  font-family:"Noto Serif Devanagari","Cormorant Garamond",serif;
  font-weight:400;font-size:clamp(14px,1.9vw,19px);
  color:var(--gold);letter-spacing:.06em;
  opacity:0;animation:fadeIn 1.2s ease 3.2s forwards;
}
.count{
  margin-top:clamp(16px,3vh,28px);
  display:none;gap:clamp(18px,4vw,42px);
  opacity:0;animation:fadeIn 1.2s ease 3.4s forwards;
}
.count.on{display:flex}
.count div{display:flex;flex-direction:column;align-items:center;min-width:3.2ch}
.count b{font-weight:500;font-size:clamp(28px,5vw,46px);line-height:1;font-variant-numeric:tabular-nums;color:var(--navy)}
.count span{margin-top:6px;font-size:13px;letter-spacing:.2em;color:var(--gold)}

@media (max-width:520px){
  .soon{letter-spacing:.26em;padding-left:.26em}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  .arch{opacity:var(--o)}
  .floor,.soon,.hi,.count{opacity:1}
  .grand{clip-path:none}
  .shine{display:none}
}
</style>
</head>

</main>

  shine.className = 'shine';
  shine.style.webkitMaskImage = shine.style.maskImage = `url(${LOGO})`;
  logo.appendChild(shine);

  const setSpread = s => back.forEach((im, i) => {
    im.style.transform = `translateZ(${(-(N - i) * GAP * s).toFixed(2)}px)`;
  });
  setSpread(reduce ? 1 : 0);

  /* ---- Pointer / touch ---- */
  let tx = 0, ty = 0, cx = 0, cy = 0, lastMove = -1e9;
  const onMove = e => {
    tx = (e.clientX / innerWidth - .5) * 2;
    ty = (e.clientY / innerHeight - .5) * 2;
    lastMove = performance.now();
  };
  if (!reduce) {
    addEventListener('pointermove', onMove, { passive: true });
    addEventListener('pointerdown', onMove, { passive: true });
    document.addEventListener('pointerleave', () => { lastMove = -1e9; });
  }

  /* ---- Gold dust ---- */
  const cv = document.getElementById('dust'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, motes = [];
  const seed = () => {
    const n = Math.round(Math.min(90, Math.max(36, W * H / 22000)));
    motes = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      z: .25 + Math.random() * .75,
      r: .7 + Math.random() * 2.1,
      s: .08 + Math.random() * .22,
      p: Math.random() * 6.28
    }));
  };
  const resize = () => {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seed();
  };
  resize(); addEventListener('resize', resize);

  const drawDust = (t) => {
    ctx.clearRect(0, 0, W, H);
    for (const m of motes) {
      if (!reduce) { m.y -= m.s * m.z; m.x += Math.sin(t / 1800 + m.p) * .12; }
      if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }
      const px = m.x + cx * 34 * m.z, py = m.y + cy * 20 * m.z;
      const a = (.16 + .36 * m.z) * (.6 + .4 * Math.sin(t / 900 + m.p));
      const g = ctx.createRadialGradient(px, py, 0, px, py, m.r * 3.2 * m.z + 1);
      g.addColorStop(0, `rgba(201,150,52,${a.toFixed(3)})`);
      g.addColorStop(1, 'rgba(201,150,52,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, m.r * 3.2 * m.z + 1, 0, 6.283); ctx.fill();
    }
  };

  /* ---- Main loop ---- */
  const T0 = performance.now(), INTRO_DELAY = 700, INTRO_DUR = 1700;
  const ease = p => 1 - Math.pow(1 - p, 3);
  let introDone = reduce;

  const frame = t => {
    const idle = t - lastMove > 2600;
    const gx = idle ? Math.sin(t / 1900) * .62 : tx;
    const gy = idle ? Math.cos(t / 2500) * .16 : ty;
    const k = reduce ? 0 : .055;
    cx += (gx - cx) * k; cy += (gy - cy) * k;

    if (!reduce) {
      rig.style.transform = `rotateX(${(-cy * 11).toFixed(2)}deg) rotateY(${(cx * 26).toFixed(2)}deg)`;
      floor.style.transform = `translateX(${(-cx * 22).toFixed(1)}px) scaleX(${(1 - Math.abs(cx) * .12).toFixed(3)})`;
      root.style.setProperty('--sx', (cx * 1.25).toFixed(3));
      root.style.setProperty('--sy', (1 - cy * .45).toFixed(3));
    }
    if (!introDone) {
      const p = Math.min(Math.max((t - T0 - INTRO_DELAY) / INTRO_DUR, 0), 1);
      setSpread(ease(p));
      if (p >= 1) introDone = true;
    }
    drawDust(t);
    if (!reduce) requestAnimationFrame(frame);
  };
  reduce ? frame(0) : requestAnimationFrame(frame);

  /* ---- Countdown (optional) ---- */
  if (OPENING_DATE) {
    const target = new Date(OPENING_DATE).getTime();
    const box = document.getElementById('count');
    const el = id => document.getElementById(id);
    const pad = n => String(n).padStart(2, '0');
    const tick = () => {
      const d = target - Date.now();
      if (!(d > 0)) { box.classList.remove('on'); return; }
      box.classList.add('on');
      el('cd').textContent = pad(Math.floor(d / 864e5));
      el('ch').textContent = pad(Math.floor(d % 864e5 / 36e5));
      el('cm').textContent = pad(Math.floor(d % 36e5 / 6e4));
      el('cs').textContent = pad(Math.floor(d % 6e4 / 1e3));
      setTimeout(tick, 1000);
    };
    tick();
  }
})();
</script>
</body>
</html>
